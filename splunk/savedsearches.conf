[soc_lab_soc_007]
displayName = SOC-007 - PowerShell launched with an encoded command
description = The -EncodedCommand (-enc / -e / -ec) switch is used to hide the real command line from anyone reading process creation logs. Legitimate IT automation rarely needs it, so treat it as high fidelity.
search = index=* (Image="*powershell.exe" OR Image="*pwsh.exe") (CommandLine="*-enc*" OR CommandLine="*-EncodedCommand*") | table _time Computer User Image ParentImage CommandLine
enableScheduled = True
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number_of_events
alert_comparator = greater than
alert_threshold = 1
counttype = number of events
quantity = 0
relation = greater than
severity = 4
mitre_technique = T1059.001
playbook = PB-002

[soc_lab_soc_008]
displayName = SOC-008 - PowerShell script block contains a download cradle
description = Script block logging (4104) captures the de-obfuscated script. IEX + DownloadString / Invoke-WebRequest / FromBase64String is the classic "pull second stage" pattern.
search = index=* EventCode=4104 (ScriptBlockText="*DownloadString*" OR ScriptBlockText="*Invoke-WebRequest*" OR ScriptBlockText="*IEX(*") | table _time Computer User ScriptBlockText
enableScheduled = True
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number_of_events
alert_comparator = greater than
alert_threshold = 1
counttype = number of events
quantity = 0
relation = greater than
severity = 5
mitre_technique = T1059.001
playbook = PB-002

