# Saved searches exported from the SOC Lab rule set.
# Load into $SPLUNK_HOME/etc/apps/soc_lab/local/
# (Splunk Enterprise Security license required for alerting).

[soc_lab_soc_001]
displayName = SOC-001 - Multiple failed logons from a single source (brute force / password spray)
description = More than 10 failed Windows logons from one source IP inside a 5 minute window. This is the classic brute-force pattern. If the same IP later produces a successful logon, escalate immediately.
search = index=* (EventCode=4625) | stats count as attempts dc(user) as user by src_ip | where attempts > 10 | sort - attempts
enableScheduled = True
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number_of_events
alert_comparator = greater than
alert_threshold = 1
counttype = number of events
quantity = 0
relation = greater than
severity = 4
mitre_technique = T1110.001
playbook = PB-001

[soc_lab_soc_002]
displayName = SOC-002 - Successful logon from a source that had recent failed logons
description = A successful Windows logon (4624) from a source IP that produced failed logons in the previous 15 minutes. This is the "the brute force worked" moment and is the highest-value detection for a Tier-1 a
search = index=* EventCode=4625 | stats count as fails dc(user) as user by src_ip | where fails > 3 | join src_ip [ search index=* EventCode=4624 | table _time src_ip user Account_Name ]
enableScheduled = True
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number_of_events
alert_comparator = greater than
alert_threshold = 1
counttype = number of events
quantity = 0
relation = greater than
severity = 5
mitre_technique = T1110.001
playbook = PB-001

[soc_lab_soc_003]
displayName = SOC-003 - New user account created on a domain controller
description = Windows event 4720 - a new account was created. Any account created outside a documented joiner-mover-leaver (JML) request must be treated as suspicious.
search = index=* EventCode=4720 | table _time user Account_Name host TargetUserName
enableScheduled = True
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number_of_events
alert_comparator = greater than
alert_threshold = 1
counttype = number of events
quantity = 0
relation = greater than
severity = 3
mitre_technique = T1136.001
playbook = PB-004

[soc_lab_soc_004]
displayName = SOC-004 - Account added to a privileged group
description = Windows event 4732 - a member was added to a security-enabled global or local group. Addition to Domain Admins or a local Administrators group is a high-fidelity indicator of privilege escalation.
search = index=* EventCode=4732 | where "TargetUserName" IN ("Domain Admins","Administrators")
enableScheduled = True
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
