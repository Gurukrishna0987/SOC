name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q --junitxml=pytest-report.xml

      - name: Run the pipeline end to end
        run: python -m soclab demo

      - name: Validate the detection coverage
        run: python -m soclab evaluate

      - name: Validate the exported Splunk assets
        run: |
          python -m soclab splunk
          test -s splunk/savedsearches.conf
          test -s splunk/dashboard_soc_lab.xml
